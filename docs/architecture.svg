<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760" role="img" aria-labelledby="title desc">
<title id="title">RecallRadar architecture</title>
<desc id="desc">Receipts become inventory, a Strands agent calls verification tools and recall sources, then either suppresses weak matches or requests human approval.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07111f"/><stop offset="1" stop-color="#10283a"/></linearGradient>
  <filter id="shadow"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-opacity=".3"/></filter>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#63e6be"/></marker>
</defs>
<rect width="1400" height="760" rx="28" fill="url(#bg)"/>
<text x="70" y="78" fill="#63e6be" font-family="Arial" font-size="18" font-weight="700" letter-spacing="3">RECALLRADAR</text>
<text x="70" y="126" fill="white" font-family="Arial" font-size="34" font-weight="700">Quiet monitoring. Evidence-first decisions.</text>
<g font-family="Arial" filter="url(#shadow)">
  <rect x="70" y="220" width="250" height="150" rx="18" fill="#13283b" stroke="#31516a"/>
  <text x="100" y="265" fill="#63e6be" font-size="17" font-weight="700">HOUSEHOLD INPUT</text>
  <text x="100" y="310" fill="white" font-size="22">Receipts + products</text>
  <text x="100" y="342" fill="#9db0c5" font-size="16">model · lot · retailer</text>

  <rect x="455" y="185" width="360" height="220" rx="22" fill="#173149" stroke="#63e6be" stroke-width="2"/>
  <text x="495" y="235" fill="#63e6be" font-size="17" font-weight="700">STRANDS AGENT</text>
  <text x="495" y="278" fill="white" font-size="25" font-weight="700">Autonomous orchestrator</text>
  <text x="495" y="320" fill="#c8d7e5" font-size="17">1. Load and validate</text>
  <text x="495" y="350" fill="#c8d7e5" font-size="17">2. Retrieve recall notices</text>
  <text x="495" y="380" fill="#c8d7e5" font-size="17">3. Verify and prepare action</text>

  <rect x="950" y="155" width="370" height="125" rx="18" fill="#13283b" stroke="#31516a"/>
  <text x="985" y="202" fill="#63e6be" font-size="17" font-weight="700">TRUSTED SOURCES</text>
  <text x="985" y="242" fill="white" font-size="21">CPSC feed · Demo feed</text>

  <rect x="950" y="330" width="370" height="125" rx="18" fill="#13283b" stroke="#31516a"/>
  <text x="985" y="377" fill="#63e6be" font-size="17" font-weight="700">DETERMINISTIC TOOLS</text>
  <text x="985" y="417" fill="white" font-size="21">Identifier match · Risk rules</text>

  <rect x="230" y="555" width="340" height="120" rx="18" fill="#13283b" stroke="#31516a"/>
  <text x="265" y="602" fill="#9db0c5" font-size="17" font-weight="700">LOW CONFIDENCE</text>
  <text x="265" y="643" fill="white" font-size="22">Suppress + keep monitoring</text>

  <rect x="820" y="535" width="430" height="160" rx="22" fill="#3b2229" stroke="#ff6b6b" stroke-width="2"/>
  <text x="860" y="582" fill="#ff9b9b" font-size="17" font-weight="700">REAL DECISION</text>
  <text x="860" y="625" fill="white" font-size="24" font-weight="700">Human approval gate</text>
  <text x="860" y="661" fill="#e5bdc4" font-size="17">stop-use · refund · replacement</text>
</g>
<g fill="none" stroke="#63e6be" stroke-width="4" marker-end="url(#arrow)">
  <path d="M320 295 H440"/>
  <path d="M950 220 H835"/>
  <path d="M950 390 H835"/>
  <path d="M555 420 C520 485 450 505 410 540"/>
  <path d="M720 420 C790 485 900 490 970 525"/>
</g>
<text x="70" y="730" fill="#7890a6" font-family="Arial" font-size="15">No external action occurs without explicit approval · Official-source verification remains required</text>
</svg>
